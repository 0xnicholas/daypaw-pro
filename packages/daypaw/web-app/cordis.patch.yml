# The @daypaw/web-app bundle patch: the daypaw browser surface over the
# dsh-base layer. Applied after dsh-base's insert; rows here override base rows
# by id, with the profile's own cordis.patch.yml and any --patch overlays still
# to come.
#
# The browser roster below keeps the upstream implementation rows as
# placeholders: removing the rows the product shell does not ship (and swapping
# in the rewritten ones) is scoped to the later board issues, not this scaffold.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence. A `--help`
# invocation provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# TODO: Re-enable shared HMR for Web after its reload lifecycle is tested.
- id: hmr
  disabled: true

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|code|both) opts a whole dsh
    # process into Code Mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # Session and file references for inline composer suggestions.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline (the turnOutline projection key): every turn of
    # the session stays navigable before its events page loads (wayfinder #85
    # verdict ②, ticket #92). Session-domain projection, complementary to the
    # fork's durable/journalTimeline right-column timeline (durable engine
    # Remote, different seam); no fork surface renders turn nodes yet, so no
    # business-language mapping applies.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # Ordered approval audit entries for the task detail pane's 审批历史
    # section (the approvalHistory projection key), folded from the
    # approval/asked + approval/decided log pair.
    - id: approval-history
      name: '@daypaw/approval-history'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Configuration-surface reads and writes over Typert Remote.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@daypaw/web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    # Web glue owned by this bundle: resolves the built daypaw frontend dist
    # (an assembly fact of @daypaw/web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, and prints the URL line. The
    # webStartup provider supplies invocation-only values; after the server
    # binds, this row samples LAN trust once and provides `webRuntime`. A
    # complete agent-preset persona suppresses the prompt section for that
    # agent while retaining the host-owned shell variable.
    - id: web-runtime
      name: '@daypaw/web-app'
      inject: [webStartup]
      config:
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service. The session-controller client face injects
    # the browser `fileUpload` service, so the graph cannot activate without
    # this row (upstream bbb2ca7c9b).
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    # The slot registry service and React renderer: synthesizes selector hooks
    # for injected stores and renders the assembled slot tree.
    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    # Session Controller adapter: session list/lifecycle selector hooks and
    # the pending-interaction roster the approval board reads.
    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    # daypaw brand theme (spec 05 §7): stacks the warm-orange accent /
    # warm-neutral base token layer and the --dp-space-* density scale onto
    # the reused ui-theme base; the light/dark preference keeps driving both
    # palettes (the layer re-picks its leg per scheme).
    - id: ui-brand-daypaw
      name: '@daypaw/ui-brand'

    # daypaw shell IA skeleton (inbox workbench): replaces the upstream
    # ui-sidebar row wholesale — the fork nav occupies 'sidebar', and shadows
    # ui-conversation's 'conversation'/'details' placeholder occupants at
    # priority -1 (their declared seats stay live for the dormant ecosystem;
    # ui-workspace seats pend silently with the upstream shell).
    - id: ui-inbox
      name: '@daypaw/ui-inbox'

    # daypaw settings single page + first-run API-key banner: occupies the two
    # ui-inbox child seats and declares 'settings.section' from the settings
    # page, which wakes ui-settings-models' models section (the other upstream
    # settings rows stay dormant on their sidebar.settings seat).
    - id: ui-settings-daypaw
      name: '@daypaw/ui-settings'

    # daypaw task surfaces: the new-task dialog (agent picker + first prompt),
    # the group task list, and the business-language conversation view — the
    # three child seats ui-inbox declares on its nav and workspace
    # registrations.
    - id: ui-tasks-daypaw
      name: '@daypaw/ui-tasks'

    # daypaw agent catalog: cards + detail over the engine's definition
    # registry read view (the durable/listDefinitions Remote endpoint),
    # occupying the 'inbox.agents.page' child seat ui-inbox declares.
    - id: ui-agents-daypaw
      name: '@daypaw/ui-agents'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    # Publishes pending approvals into the session roster (the board's
    # 等待你确认 feed) and answers the Remote Event waterfall. The fork's own
    # conversation view shadows its composer presentation.
    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    # The Chat conversation target: assembles the chat snapshot the fork's
    # business-language projection and approval-card pairing read.
    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # Attachment presentation over conversation slots: the composer draft
    # rail, the drop invitation, persisted images in Chat/Trajectory/Tool
    # results, and the original-image lightbox. Pure presentation — the
    # slot owners (ui-conversation, ui-chat, ui-tool, ui-trajectory, all
    # mounted here) supply the data (wayfinder #100 verdict ②, ticket #104).
    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'


    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-subagent /
    # ui-reference).
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    # The '@' composer entry's file/session candidate list, over the
    # file-reference-local and session-reference service rows mounted above
    # (wayfinder #100 verdict ②, ticket #104). Section labels are
    # locale-registered, so no fork vocabulary work applies.
    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    # Read-only active Schedule catalog, mirroring the upstream shipped-web
    # graph: the row stays disabled until the schedule walk-through verdict
    # reopens it (wayfinder #85 verdict ①/④ — mirror upstream, zero cost).
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
      disabled: true

    # Background jobs: the session-header list over the jobsBySession mirror.
    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # The agent-preset surfaces retire to the upstream compatibility layer
    # (ADR 0012 §4): shell-started tasks are engine runs and never compose a
    # preset, so the before-the-fact surfaces (the General default-preset
    # row, the new-session chip, the roster management section) would promise
    # a choice the product no longer offers — disabling, not deleting, per
    # the shared-base precedent above.
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'
      disabled: true

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

# ── the agent plane rides the host composition ──────────────────────────────
#
# The model-side tool line (bash/pwsh, fs, web, todo, skills, goals, plan
# mode, compaction, delegation, workflows) stays live on the host plane: the
# base rows flow through this overlay untouched, so every agent in the process
# inherits the full global tools layer — plain shell sessions AND engine-run
# SDK agents, whose `tools: []` declarations add to (never subtract from) the
# host surface (ADR 0013 §3, ticket #103: the capability base is open, and the
# #46 conservative approval default — workspace-write sandbox, approval `ask`,
# both mounted host-plane in the base — stays the one defense line).
#
# Upstream's web overlay disables these rows and remounts them per session
# through agent presets. daypaw keeps one plane per row: a row live on both
# planes mounts twice (an `isolate` realm shadows the host instance for its
# own consumers; a host-singleton registration collides on the second
# session), so the preset roster stays disabled at the bottom of this file and
# sessions compose the host composition — the documented fallback when the
# roster service is absent (ADR 0012 §4: presets are the upstream
# compatibility layer).
#
# What keeps these rows host-plane (the criteria a later change must not
# invert): `shell-env` is injected by the web-runtime row before any session
# exists; the jobs, skill, and subagent registries are read by rows outside
# any one preset's realm (a realm-local copy is invisible to sibling rows) and
# are keyed by owning agent or session, so one host instance serves every
# agent; the goal service and token meter back Gateway Remote endpoints and
# the process-wide projection units the browser reads for every session. The
# reasoning has one home in
# .agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md.

# `tool-ask-user` ships only through presets upstream (no base row exists);
# mounted host-plane here so the open capability base keeps the
# ask_user_question tool — the producer of the mounted ui-user-questions face.
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# The preset roster (ADR 0012 §4: the upstream compatibility layer).
# Shell-started tasks are engine runs that never compose a preset, and
# sessions created here compose the host plane above, so mounting `standard`
# would double every row on both planes — a row belongs to exactly one plane.
# A session whose log carries a preset identity resumes on the host
# composition; the stale identity is harmless, and the ui-agent-preset
# surface is disabled above under the same ruling.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      disabled: true
      config:
        default: standard
