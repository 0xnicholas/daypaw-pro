# daypaw gate — the fork's linux main gate (ADR 0007 §5): keyless
# test / coverage / snapshot / typecheck / lint on every push to main.
# Fork-owned purely-additive file: upstream ci.yml's matrix is
# runner-infrastructure-coupled (enterprise labeled runners on pull_request,
# self-hosted master drills on push), none of which exists in this fork, so
# the keep-list is realized here. Inherited heavyweight lanes are disabled in
# repository settings, not by file changes.
name: daypaw gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # The CI coverage gate, not plain `test` (AGENTS.md); runs the unit tier.
      # Worker clamp: both vitest projects fork per-file processes; on a 4-vCPU
      # standard runner the unclamped default starves process-bound suites'
      # 30s OS-cleanup budgets (subprocess-local process-exit timeout on first
      # run). Upstream runs this gate on 16-core enterprise runners.
      - name: Coverage gate (per-file 100%)
        run: pnpm run test:coverage -- --max-workers=2

      # Replay mode is the default without DSH_SNAPSHOT; expected outputs are
      # never written in CI (testing.md owns the record policy).
      - name: Snapshot replay
        run: pnpm run test:snapshot
