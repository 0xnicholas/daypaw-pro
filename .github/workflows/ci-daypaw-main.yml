name: CI (daypaw main)

# The inherited CI lanes cannot run in this fork: the pull_request workflow's
# runner labels exist only in the upstream organization, and CI master watches
# the upstream default branch. This fork-owned lane gives main pushes two
# signals split by determinism on hosted 4-vCPU hardware:
#
# - linux / deterministic gates (required): the ci-daypaw-hosted aggregate —
#   every gate of upstream's primary aggregate whose verdict is deterministic
#   (static checks, typert contracts, typecheck, lint, duplication, node
#   smokes, doc-sync, module graph, knip, build, publint, node-next types,
#   built-package invariants, bin smoke) plus the web browser snapshot lane.
#   Four real defects were caught by exactly these gates during the lane's
#   first runs.
# - linux / timing-sensitive lanes (advisory): the full coverage suite and the
#   recorded-session snapshot replays. Their process tests measure the host on
#   this hardware class — upstream runs them on 16-core enterprise runners and
#   keeps its own hosted serial reference disabled — so they report per push
#   without gating it. Restoring them as gates requires enterprise-class
#   runners or upstream stabilization.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded main push is cancelled so a fresh head never queues behind a
  # stale one; manual dispatches join the same per-ref group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  deterministic:
    name: linux / deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run the deterministic gate aggregate
        env:
          # Gates run one at a time so a 4-vCPU runner never juggles two lanes;
          # each lane then uses its natural intra-suite parallelism, matching
          # the upstream pull-request lane's execution shape.
          DSH_GATE_CONCURRENCY: '1'
        run: pnpm run check:ci:daypaw-hosted

  timing-sensitive:
    name: linux / timing-sensitive lanes (advisory on hosted hardware)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Coverage suite (full)
        run: pnpm exec vitest run --coverage

      - name: Recorded-session snapshot replays
        run: pnpm run test:snapshot
