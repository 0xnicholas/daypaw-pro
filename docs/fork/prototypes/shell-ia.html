<!DOCTYPE html>
<!-- PROTOTYPE (throwaway): #39 信息架构草图。三变体 ?variant=A|B|C，底部条或 ←/→ 切换。-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品壳 IA 原型 — 三变体</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f3f5;color:#1f2329;font-size:14px}
button{font-family:inherit}
.shell{height:100vh;display:flex;flex-direction:column}
.topbar{height:50px;display:flex;align-items:center;gap:18px;padding:0 18px;background:#fff;border-bottom:1px solid #e3e5e9;flex:none}
.vtag{font-family:ui-monospace,Menlo,Consolas,monospace;color:#9aa0aa;font-size:12px;white-space:nowrap}
.spacer{flex:1}
.mainnav{display:flex;gap:4px}
.navitem{border:none;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:#4e5563}
.navitem:hover{background:#f2f3f5}
.navitem.on{background:#eaf1ff;color:#1f5eff;font-weight:600}
.dot{display:inline-block;background:#e8452c;color:#fff;border-radius:9px;font-size:11px;line-height:16px;padding:0 6px;margin-left:5px;vertical-align:1px}
.cols{flex:1;display:grid;grid-template-columns:280px minmax(0,1fr) 330px;min-height:0}
.col{overflow-y:auto;min-height:0}
.left{background:#fff;border-right:1px solid #e3e5e9;padding:12px;display:flex;flex-direction:column}
.mid{padding:22px 30px}
.right{background:#fff;border-left:1px solid #e3e5e9;padding:18px}
h3{margin:0 0 4px;font-size:16px}
h4{margin:18px 0 8px;font-size:12px;color:#8a8f99;font-weight:600;letter-spacing:.5px}
.ghead{font-size:12px;color:#8a8f99;font-weight:600;margin:14px 4px 6px;letter-spacing:.5px}
.ghead:first-child{margin-top:2px}
.badge{display:inline-block;border-radius:10px;font-size:11px;line-height:18px;padding:0 8px;white-space:nowrap}
.st-active{background:#e8f0ff;color:#1f5eff}
.st-confirm{background:#fff1de;color:#d97706}
.st-done{background:#e5f7ec;color:#12934a}
.st-error{background:#ffe9e7;color:#d9362b}
.st-cancelled{background:#eceef1;color:#8a8f99}
.btn{border:1px solid #d6d9de;background:#fff;border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer;color:#1f2329}
.btn:hover{background:#f5f6f8}
.btn.ok{background:#1f5eff;border-color:#1f5eff;color:#fff}
.btn.ok:hover{background:#1a51d9}
.btn.no{color:#d9362b;border-color:#f0b8b4}
.btn.no:hover{background:#fff3f2}
.btn.retry{background:#d9362b;border-color:#d9362b;color:#fff;margin-top:8px}
.newtask{width:100%;padding:9px;border-radius:8px;border:1px solid #d6d9de;background:#fff;font-size:14px;cursor:pointer;color:#1f5eff;font-weight:600}
.newtask:hover{background:#f4f8ff}
.newtask-big{width:100%;padding:13px;border-radius:10px;border:none;background:#1f5eff;color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(31,94,255,.3)}
.newtask-big:hover{background:#1a51d9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid #d6d9de;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:#4e5563}
.chip.on{background:#1f2329;border-color:#1f2329;color:#fff}
.titem{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.titem:hover{background:#f5f6f8}
.titem.sel{background:#eaf1ff}
.titem .tt{font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.titem .tm{font-size:12px;color:#8a8f99}
.msg{max-width:72%;margin-bottom:12px;padding:10px 14px;border-radius:12px;line-height:1.6}
.msg.user{margin-left:auto;background:#1f5eff;color:#fff;border-bottom-right-radius:4px}
.msg.agent{background:#fff;border:1px solid #e6e8ec;border-bottom-left-radius:4px}
.msg .who{font-size:11px;color:#8a8f99;margin-bottom:4px}
.msg.user .who{color:rgba(255,255,255,.75)}
.composer{display:flex;gap:8px;margin-top:16px}
.composer input{flex:1;padding:10px 14px;border:1px solid #d6d9de;border-radius:9px;font-size:14px;outline:none}
.composer input:focus{border-color:#1f5eff}
.d-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-meta{font-size:12px;color:#8a8f99;margin-top:6px}
.errbox{margin-top:12px;background:#fff3f2;border:1px solid #f3c6c2;border-radius:9px;padding:10px 12px;color:#b3271e;font-size:13px;line-height:1.6}
.steps{list-style:none;margin:0;padding:0}
.steps li{padding:5px 0;font-size:13px;color:#4e5563}
.steps li.done{color:#12934a}
.steps li.active{color:#1f5eff;font-weight:600}
.steps li.err{color:#d9362b}
.subs,.outs,.hist{list-style:none;margin:0;padding:0}
.subs li{padding:6px 0;font-size:13px;display:flex;align-items:center;gap:8px}
.outs li{padding:6px 0;font-size:13px;color:#1f5eff;cursor:pointer}
.hist li{padding:8px 0;border-bottom:1px dashed #eceef1;font-size:13px}
.hist li:last-child{border-bottom:none}
.h-time{font-size:11px;color:#8a8f99;margin-top:2px}
.ap-card{background:#fffdf6;border:1px solid #f0dfa8;border-radius:12px;padding:14px 16px;margin:14px 0}
.ap-title{font-weight:600;line-height:1.6}
.ap-meta{font-size:12px;color:#8a8f99;margin-top:4px}
.ap-actions{display:flex;gap:8px;margin-top:10px}
.ap-raw{margin-top:10px;font-size:12px;color:#8a8f99}
.ap-raw summary{cursor:pointer}
.ap-raw code{display:block;margin-top:6px;background:#f5f2e6;border-radius:6px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#5a5140;white-space:pre-wrap}
.ap-item{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px}
.ap-item:hover{background:#f5f6f8}
.ap-item.sel{background:#fff6df}
.ap-item .tt{font-weight:600;font-size:13px;line-height:1.5}
.ap-item .tm{font-size:12px;color:#8a8f99;margin-top:3px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.acard{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:16px;cursor:pointer}
.acard:hover{border-color:#1f5eff;box-shadow:0 4px 14px rgba(31,94,255,.1)}
.acard .an{font-weight:700;font-size:15px;margin-bottom:6px}
.acard .ad{font-size:13px;color:#4e5563;line-height:1.6}
.setrow{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:16px;margin-bottom:12px}
.setrow .st{font-weight:600;margin-bottom:6px}
.setrow .sd{font-size:13px;color:#4e5563;line-height:1.7}
.tbd{display:inline-block;background:#fff1de;color:#d97706;border-radius:6px;font-size:11px;padding:1px 7px;margin-left:6px}
.radio{display:inline-flex;gap:6px;margin-top:8px}
.radio span{border:1px solid #d6d9de;border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer}
.radio span.on{background:#1f5eff;border-color:#1f5eff;color:#fff}
.prog-card{background:#eef4ff;border:1px solid #c9d9fb;border-radius:12px;padding:14px 16px;margin:14px 0}
.prog-card .pc-title{font-weight:700;color:#1f5eff;margin-bottom:6px}
.bell{position:relative;border:1px solid #d6d9de;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:15px}
.bdg{position:absolute;top:-7px;right:-7px;background:#e8452c;color:#fff;border-radius:9px;font-size:11px;line-height:16px;padding:0 5px}
.iconbtn{border:1px solid #d6d9de;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:#4e5563}
.iconbtn:hover{background:#f5f6f8}
.overlay{position:fixed;inset:0;background:rgba(15,18,25,.35);z-index:60}
.drawer{position:fixed;top:0;right:0;width:370px;height:100vh;background:#f7f8fa;box-shadow:-10px 0 30px rgba(0,0,0,.18);z-index:70;padding:18px;overflow-y:auto}
.drawer h3{margin-bottom:2px}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-width:92vw;background:#fff;border-radius:14px;z-index:70;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.25)}
.modal .agrid{margin-top:14px}
.subnav{margin-top:auto;padding-top:12px;border-top:1px solid #eceef1;display:flex;gap:6px}
.subnav button{flex:1;border:none;background:none;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;color:#4e5563}
.subnav button:hover{background:#f2f3f5}
.subnav button.on{background:#eaf1ff;color:#1f5eff;font-weight:600}
.empty{color:#b0b5bd;font-size:13px;text-align:center;margin-top:60px}
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#141414;border:2px dashed #ffd400;border-radius:999px;padding:8px 14px;z-index:999;font-family:ui-monospace,Menlo,Consolas,monospace;color:#ffd400;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#switcher .tag{font-size:10px;background:#ffd400;color:#141414;border-radius:4px;padding:2px 6px;font-weight:700;letter-spacing:1px}
#switcher button{background:#ffd400;border:none;color:#141414;width:28px;height:28px;border-radius:50%;font-size:15px;font-weight:700;cursor:pointer;line-height:1}
#vlabel{min-width:160px;text-align:center;font-size:13px;font-weight:600}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#1f2329;color:#fff;border-radius:9px;padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>

<div id="switcher">
  <span class="tag">PROTOTYPE</span>
  <button data-act="prev" title="上一个变体（←）">‹</button>
  <span id="vlabel"></span>
  <button data-act="next" title="下一个变体（→）">›</button>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ================= Mock 数据（中文业务场景） ================= */

const AGENTS = [
  { id: 'weekly',  name: '周报助手',     desc: '汇总本周各业务线进展，自动生成团队周报草稿。' },
  { id: 'crm',     name: '客户运营助理', desc: '整理客户名单、安排回访节奏、起草跟进消息。' },
  { id: 'finance', name: '财务核对员',   desc: '核对发票与报销单据，标记金额不一致的条目。' },
  { id: 'research',name: '市场调研助理', desc: '收集行业信息，整理竞品动态与定价参考。' },
];

const STATUS = {
  active:    { label: '进行中',     cls: 'st-active' },
  confirm:   { label: '等待你确认', cls: 'st-confirm' },
  done:      { label: '已完成',     cls: 'st-done' },
  error:     { label: '出错了',     cls: 'st-error' },
  cancelled: { label: '已取消',     cls: 'st-cancelled' },
};

const TASKS = [
  {
    id: 't1', title: '周报汇总', agent: 'weekly', st: 'active', updated: '10 分钟前',
    steps: [
      { st: 'done',   text: '收集三条业务线提交的材料' },
      { st: 'done',   text: '整理本周要点与数据' },
      { st: 'active', text: '生成周报初稿' },
      { st: 'todo',   text: '等你确认后发布到团队空间' },
    ],
    outputs: ['周报草稿（第 3 版）'],
    convo: [
      { from: 'user',  text: '帮我把这周各业务线的进展汇总成周报。' },
      { from: 'agent', text: '收到。我已经拿到销售、产品、客服三条线提交的材料，正在整理要点。' },
      { t: 'progress' },
      { from: 'agent', text: '初稿写好了，放在右侧「产出物」里，你可以直接在上面改。' },
    ],
  },
  {
    id: 't2', title: '客户回访名单整理', agent: 'crm', st: 'confirm', updated: '今天 10:24',
    steps: [
      { st: 'done',   text: '筛出 90 天未回访的成交客户（37 位）' },
      { st: 'done',   text: '按成交金额排序并分组' },
      { st: 'active', text: '等待你确认发送回访邀请' },
    ],
    outputs: ['回访名单（37 人）'],
    history: [
      { time: '昨天 15:40', result: '已同意', text: '导出回访名单到表格' },
    ],
    convo: [
      { from: 'user',  text: '整理一下上季度成交的客户，挑出需要回访的。' },
      { from: 'agent', text: '已筛出 37 位超过 90 天未回访的客户，名单整理好了。' },
      { t: 'approval', id: 'a1' },
    ],
  },
  {
    id: 't3', title: '发票核对', agent: 'finance', st: 'error', updated: '今天 09:05',
    err: '核对到第 42 张时，税务平台连接中断。',
    steps: [
      { st: 'done', text: '读取 7 月进项发票清单（共 96 张）' },
      { st: 'err',  text: '逐张核对 —— 在第 42 张处中断' },
    ],
    convo: [
      { from: 'user',  text: '核对一下 7 月的进项发票。' },
      { from: 'agent', text: '已核对 41 张，暂时没有发现金额不一致。' },
      { from: 'agent', text: '核对到第 42 张时税务平台连接中断，任务出错了。你可以点右侧「重试」从中断处继续。' },
    ],
  },
  {
    id: 't4', title: '季度报销统计', agent: 'finance', st: 'done', updated: '周二 18:30',
    steps: [
      { st: 'done', text: '汇总本季度全部报销单据（214 笔）' },
      { st: 'done', text: '标记 6 笔异常报销' },
      { st: 'done', text: '发送统计表给财务主管' },
    ],
    outputs: ['季度报销统计表', '异常报销清单（6 笔）'],
    history: [
      { time: '周二 09:12', result: '已同意', text: '将统计表发送给财务主管' },
    ],
    convo: [
      { from: 'user',  text: '统计一下这个季度的报销，看看有没有异常的。' },
      { from: 'agent', text: '完成了。共 214 笔报销，其中 6 笔金额异常，清单和统计表都在右侧。' },
    ],
  },
  {
    id: 't5', title: '新品定价调研', agent: 'research', st: 'confirm', updated: '昨天 16:02',
    steps: [
      { st: 'done',   text: '明确调研范围与参考对象' },
      { st: 'active', text: '收集三家竞品定价（子任务进行中）' },
      { st: 'active', text: '等待你确认购买行业报告' },
    ],
    subs: [
      { title: '收集三家竞品定价', st: 'active' },
      { title: '整理本公司成本结构', st: 'done' },
    ],
    convo: [
      { from: 'user',  text: '调研一下新品该怎么定价，看看竞品都怎么收费。' },
      { from: 'agent', text: '我拆成了两个小任务同步进行：收集竞品定价、整理我们的成本结构，进展见右侧。' },
      { t: 'progress' },
      { from: 'agent', text: '有一份付费行业报告对定价很有参考价值，需要你确认一下。' },
      { t: 'approval', id: 'a2' },
    ],
  },
  {
    id: 't6', title: '会议纪要归档', agent: 'weekly', st: 'cancelled', updated: '周一 11:20',
    convo: [
      { from: 'user',  text: '把上周五例会的纪要归档到知识库。' },
      { from: 'agent', text: '好的，正在整理——' },
      { from: 'agent', text: '你已取消该任务。' },
    ],
  },
];

const APPROVALS = [
  {
    id: 'a1', taskId: 't2', time: '今天 10:24',
    summary: '向 37 位客户发送回访邀请短信',
    raw: 'send_sms --list 回访名单-Q3.csv --template 回访邀约-v2 --count 37',
  },
  {
    id: 'a2', taskId: 't5', time: '昨天 16:02',
    summary: '购买《2026 行业定价报告》（¥299）作为参考',
    raw: 'purchase_report --id industry-pricing-2026 --amount 299',
  },
];

const VARIANTS = {
  A: 'A — 任务为中心',
  B: 'B — 对话为中心',
  C: 'C — 收件箱工作台',
};

/* ================= 状态 ================= */

const q = new URLSearchParams(location.search).get('variant');
const state = {
  variant: ['A', 'B', 'C'].includes(q) ? q : 'A',
  view: 'tasks',        // A 主导航
  cview: 'inbox',       // C 次要导航
  taskId: 't1',
  approvalId: 'a1',
  agentId: 'weekly',
  filter: 'all',
  drawer: false,
  picker: false,
};

/* ================= 工具 ================= */

const $ = (s) => document.querySelector(s);
const taskById = (id) => TASKS.find((t) => t.id === id);
const agentName = (id) => (AGENTS.find((a) => a.id === id) || {}).name || id;
const badge = (st) => `<span class="badge ${STATUS[st].cls}">${STATUS[st].label}</span>`;

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function stepsHtml(t) {
  if (!t.steps) return '';
  const icon = { done: '✓', active: '●', err: '✕', todo: '○' };
  return `<ul class="steps">${t.steps.map((s) =>
    `<li class="${s.st}">${icon[s.st]} ${s.text}</li>`).join('')}</ul>`;
}

function approvalCard(a, compact) {
  const t = taskById(a.taskId);
  return `<div class="ap-card">
    <div class="ap-title">「${t.title}」请你确认：${a.summary}</div>
    <div class="ap-meta">${a.time} · 来自 ${agentName(t.agent)}</div>
    <div class="ap-actions">
      <button class="btn ok" data-act="approve">同意</button>
      <button class="btn no" data-act="reject">拒绝</button>
    </div>
    ${compact ? '' : `<details class="ap-raw"><summary>查看原始命令</summary><code>${a.raw}</code></details>`}
  </div>`;
}

function detailHtml(t) {
  return `
    <div class="d-head"><h3>${t.title}</h3>${badge(t.st)}</div>
    <div class="d-meta">负责 Agent：${agentName(t.agent)} · 更新于 ${t.updated}</div>
    ${t.st === 'error' ? `<div class="errbox">${t.err}<br><button class="btn retry" data-act="retry">重试</button></div>` : ''}
    ${t.steps ? `<h4>进度</h4>${stepsHtml(t)}` : ''}
    ${t.subs ? `<h4>子任务（${t.subs.length}）</h4><ul class="subs">${t.subs.map((x) =>
      `<li>${badge(x.st)} ${x.title}</li>`).join('')}</ul>` : ''}
    ${t.outputs ? `<h4>产出物</h4><ul class="outs">${t.outputs.map((o) =>
      `<li data-act="output">📄 ${o}</li>`).join('')}</ul>` : ''}
    ${t.history ? `<h4>审批历史</h4><ul class="hist">${t.history.map((x) =>
      `<li><b>${x.result}</b> · ${x.text}<div class="h-time">${x.time}</div></li>`).join('')}</ul>` : ''}
  `;
}

function convoHtml(t, inline) {
  const rows = t.convo.map((m) => {
    if (m.t === 'progress') {
      if (!inline) return '';
      return `<div class="prog-card"><div class="pc-title">任务进度 · ${t.title}</div>${stepsHtml(t)}</div>`;
    }
    if (m.t === 'approval') {
      if (!inline) return '';
      const a = APPROVALS.find((x) => x.id === m.id);
      return approvalCard(a, true);
    }
    const who = m.from === 'user' ? '你' : agentName(t.agent);
    return `<div class="msg ${m.from}"><div class="who">${who}</div>${m.text}</div>`;
  }).join('');
  return rows + `
    <div class="composer">
      <input type="text" placeholder="给「${agentName(t.agent)}」发消息…（原型只读）" data-composer>
      <button class="btn ok" data-act="send">发送</button>
    </div>`;
}

function agentGrid(act) {
  return `<div class="agrid">${AGENTS.map((a) => `
    <div class="acard" data-act="${act}" data-id="${a.id}">
      <div class="an">${a.name}</div>
      <div class="ad">${a.desc}</div>
    </div>`).join('')}</div>`;
}

function settingsHtml() {
  return `
    <div class="setrow"><div class="st">个人信息</div><div class="sd">张三 · 运营部（原型占位）</div></div>
    <div class="setrow"><div class="st">通知</div><div class="sd">任务需要确认时通过网页通知提醒我。</div></div>
    <div class="setrow"><div class="st">模型档位<span class="tbd">TBD</span></div>
      <div class="sd">快速：响应更快，适合日常整理；深入：思考更充分，适合分析与核对。<br>TBD：实际沿用完整模型选择，此处仅画简化业务档位示意。</div>
      <div class="radio"><span class="on" data-act="tier">快速</span><span data-act="tier">深入</span></div>
    </div>`;
}

/* ================= 变体 A — 任务为中心 ================= */

function renderA() {
  const nav = [['tasks', '任务'], ['approvals', '审批'], ['agents', 'Agents'], ['settings', '设置']];
  let body = '';
  if (state.view === 'tasks') body = aTasks();
  else if (state.view === 'approvals') body = aApprovals();
  else if (state.view === 'agents') body = aAgents();
  else body = aSettings();
  return `<div class="shell">
    <header class="topbar">
      <span class="vtag">/* A — 任务为中心 */</span>
      <nav class="mainnav">${nav.map(([k, l]) =>
        `<button class="navitem ${state.view === k ? 'on' : ''}" data-act="nav" data-id="${k}">${l}${k === 'approvals' ? `<span class="dot">${APPROVALS.length}</span>` : ''}</button>`).join('')}</nav>
    </header>
    <div class="cols">${body}</div>
  </div>`;
}

function aTasks() {
  const FILTERS = [['all', '全部'], ['confirm', '等待确认'], ['active', '进行中'], ['error', '出错了'], ['done', '已完成'], ['cancelled', '已取消']];
  const list = state.filter === 'all' ? TASKS : TASKS.filter((t) => t.st === state.filter);
  const groups = state.filter === 'all'
    ? ['confirm', 'error', 'active', 'done', 'cancelled'].map((st) => ({ st, items: list.filter((t) => t.st === st) })).filter((g) => g.items.length)
    : [{ st: null, items: list }];
  const t = taskById(state.taskId);
  return `
    <aside class="col left">
      <button class="newtask" data-act="new-task">+ 新任务</button>
      <div class="chips">${FILTERS.map(([k, l]) =>
        `<span class="chip ${state.filter === k ? 'on' : ''}" data-act="filter" data-id="${k}">${l}</span>`).join('')}</div>
      ${groups.map((g) => `
        ${g.st ? `<div class="ghead">${STATUS[g.st].label}（${g.items.length}）</div>` : ''}
        ${g.items.map((x) => `
          <div class="titem ${x.id === state.taskId ? 'sel' : ''}" data-act="select-task" data-id="${x.id}">
            <div class="tt"><span>${x.title}</span>${badge(x.st)}</div>
            <div class="tm">${agentName(x.agent)} · ${x.updated}</div>
          </div>`).join('')}`).join('')}
    </aside>
    <main class="col mid">${convoHtml(t, false)}</main>
    <aside class="col right">${detailHtml(t)}</aside>`;
}

function aApprovals() {
  const a = APPROVALS.find((x) => x.id === state.approvalId);
  const t = taskById(a.taskId);
  return `
    <aside class="col left">
      <div class="ghead">待办审批（${APPROVALS.length}）</div>
      ${APPROVALS.map((x) => `
        <div class="ap-item ${x.id === state.approvalId ? 'sel' : ''}" data-act="select-approval" data-id="${x.id}">
          <div class="tt">${x.summary}</div>
          <div class="tm">${taskById(x.taskId).title} · ${x.time}</div>
        </div>`).join('')}
    </aside>
    <main class="col mid">
      <h3>审批详情</h3>
      ${approvalCard(a, false)}
    </main>
    <aside class="col right">
      <h4>关联任务</h4>
      <div class="titem" data-act="select-task" data-id="${t.id}">
        <div class="tt"><span>${t.title}</span>${badge(t.st)}</div>
        <div class="tm">${agentName(t.agent)} · ${t.updated}</div>
      </div>
    </aside>`;
}

function aAgents() {
  const a = AGENTS.find((x) => x.id === state.agentId);
  return `
    <aside class="col left">
      <div class="ghead">Agent 目录（${AGENTS.length}）</div>
      ${AGENTS.map((x) => `
        <div class="titem ${x.id === state.agentId ? 'sel' : ''}" data-act="select-agent" data-id="${x.id}">
          <div class="tt"><span>${x.name}</span></div>
          <div class="tm">${x.desc}</div>
        </div>`).join('')}
    </aside>
    <main class="col mid">
      <h3>${a.name}</h3>
      <p style="color:#4e5563;line-height:1.7">${a.desc}</p>
      <button class="btn ok" data-act="new-task">向它发起新任务</button>
    </main>
    <aside class="col right"><div class="empty">选择左侧 Agent 查看详情</div></aside>`;
}

function aSettings() {
  return `
    <aside class="col left"><div class="ghead">设置</div>
      <div class="titem sel"><div class="tt"><span>通用</span></div></div>
    </aside>
    <main class="col mid">${settingsHtml()}</main>
    <aside class="col right"><div class="empty">—</div></aside>`;
}

/* ================= 变体 B — 对话为中心 ================= */

function renderB() {
  const t = taskById(state.taskId);
  return `<div class="shell">
    <header class="topbar">
      <span class="vtag">/* B — 对话为中心 */</span>
      <span class="spacer"></span>
      <button class="iconbtn" data-act="settings-soon">设置</button>
      <button class="bell" data-act="bell" title="审批待办">🔔<span class="bdg">${APPROVALS.length}</span></button>
    </header>
    <div class="cols">
      <aside class="col left">
        <div class="ghead">Agents —— 点卡片开新对话</div>
        ${AGENTS.map((a) => `
          <div class="titem" data-act="open-agent" data-id="${a.id}">
            <div class="tt"><span>${a.name}</span></div>
            <div class="tm">${a.desc}</div>
          </div>`).join('')}
        <div class="ghead">最近对话</div>
        ${TASKS.map((x) => `
          <div class="titem ${x.id === state.taskId ? 'sel' : ''}" data-act="select-task" data-id="${x.id}">
            <div class="tt"><span>${x.title}</span>${badge(x.st)}</div>
            <div class="tm">${agentName(x.agent)} · ${x.updated}</div>
          </div>`).join('')}
      </aside>
      <main class="col mid">${convoHtml(t, true)}</main>
      <aside class="col right">
        <h4 style="margin-top:0">当前任务进度</h4>
        ${detailHtml(t)}
      </aside>
    </div>
    ${state.drawer ? `
      <div class="overlay" data-act="bell"></div>
      <div class="drawer">
        <h3>审批待办（${APPROVALS.length}）</h3>
        <div class="d-meta">处理完会自动消失</div>
        ${APPROVALS.map((a) => approvalCard(a, false)).join('')}
        <button class="btn" data-act="bell" style="width:100%">收起</button>
      </div>` : ''}
  </div>`;
}

/* ================= 变体 C — 收件箱工作台 ================= */

function renderC() {
  let mid = '';
  if (state.cview === 'agents') mid = `<h3>Agents</h3><p style="color:#8a8f99">选择一个 Agent 发起新任务</p>${agentGrid('pick-agent-inline')}`;
  else if (state.cview === 'settings') mid = settingsHtml();
  else {
    const t = taskById(state.taskId);
    const pending = APPROVALS.filter((a) => a.taskId === t.id);
    mid = (pending.length ? pending.map((a) => approvalCard(a, false)).join('') : '') + convoHtml(t, true);
  }
  const groups = [
    { label: '等待你确认', items: TASKS.filter((t) => t.st === 'confirm') },
    { label: '进行中',     items: TASKS.filter((t) => t.st === 'active' || t.st === 'error') },
    { label: '已完成',     items: TASKS.filter((t) => t.st === 'done') },
    { label: '已取消',     items: TASKS.filter((t) => t.st === 'cancelled') },
  ];
  const t = taskById(state.taskId);
  return `<div class="shell">
    <div class="cols" style="grid-template-columns:300px minmax(0,1fr) 330px">
      <aside class="col left">
        <button class="newtask-big" data-act="new-task">+ 新任务</button>
        <div class="vtag" style="margin:10px 2px 0">/* C — 收件箱工作台 */</div>
        ${groups.map((g) => `
          <div class="ghead">${g.label}（${g.items.length}）</div>
          ${g.items.map((x) => `
            <div class="titem ${state.cview === 'inbox' && x.id === state.taskId ? 'sel' : ''}" data-act="select-inbox" data-id="${x.id}">
              <div class="tt"><span>${x.title}</span>${badge(x.st)}</div>
              <div class="tm">${agentName(x.agent)} · ${x.updated}</div>
            </div>`).join('')}`).join('')}
        <div class="subnav">
          <button class="${state.cview === 'agents' ? 'on' : ''}" data-act="cview" data-id="agents">Agents</button>
          <button class="${state.cview === 'settings' ? 'on' : ''}" data-act="cview" data-id="settings">设置</button>
        </div>
      </aside>
      <main class="col mid">${mid}</main>
      <aside class="col right">${state.cview === 'inbox' ? detailHtml(t) : '<div class="empty">—</div>'}</aside>
    </div>
    ${state.picker ? `
      <div class="overlay" data-act="close-picker"></div>
      <div class="modal">
        <h3>新任务 —— 交给谁做？</h3>
        ${agentGrid('pick-agent')}
      </div>` : ''}
  </div>`;
}

/* ================= 渲染与切换 ================= */

function render() {
  $('#app').innerHTML = state.variant === 'A' ? renderA() : state.variant === 'B' ? renderB() : renderC();
  $('#vlabel').textContent = VARIANTS[state.variant];
}

function setVariant(v) {
  state.variant = v;
  state.drawer = false;
  state.picker = false;
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  render();
}

const ORDER = ['A', 'B', 'C'];
function cycle(d) {
  setVariant(ORDER[(ORDER.indexOf(state.variant) + d + ORDER.length) % ORDER.length]);
}

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'prev': cycle(-1); break;
    case 'next': cycle(1); break;
    case 'nav': state.view = id; render(); break;
    case 'cview': state.cview = id; render(); break;
    case 'filter': state.filter = id; render(); break;
    case 'select-task': state.taskId = id; state.view = 'tasks'; render(); break;
    case 'select-inbox': state.taskId = id; state.cview = 'inbox'; render(); break;
    case 'select-approval': state.approvalId = id; render(); break;
    case 'select-agent': state.agentId = id; render(); break;
    case 'bell': state.drawer = !state.drawer; render(); break;
    case 'new-task':
      if (state.variant === 'C') { state.picker = true; render(); }
      else toast('原型演示：弹出 Agent 选择面板，发起新任务');
      break;
    case 'close-picker': state.picker = false; render(); break;
    case 'pick-agent': state.picker = false; toast(`原型演示：向「${agentName(id)}」发起了新任务`); render(); break;
    case 'pick-agent-inline': toast(`原型演示：向「${agentName(id)}」发起了新任务`); break;
    case 'open-agent': toast(`原型演示：与「${agentName(id)}」开启新对话`); break;
    case 'approve': toast('原型演示：已点击「同意」'); break;
    case 'reject': toast('原型演示：已点击「拒绝」'); break;
    case 'retry': toast('原型演示：已点击「重试」'); break;
    case 'send': toast('原型演示：消息不会真的发出'); break;
    case 'output': toast('原型演示：预览产出物'); break;
    case 'tier': toast('原型演示：模型档位为 TBD 示意'); break;
    case 'settings-soon': toast('原型演示：设置入口（见变体 A/C 的设置页）'); break;
  }
});

render();
</script>
</body>
</html>
